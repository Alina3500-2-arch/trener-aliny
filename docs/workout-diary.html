<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Тренировки</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#332e34;background:#ffffff}*{box-sizing:border-box}body{margin:0;padding:calc(env(safe-area-inset-top) + 30px) 15px 90px}button,input{font:inherit}button{cursor:pointer;border:0}header{display:flex;align-items:center;justify-content:space-between;margin:6px 0 20px}h1{font-size:25px;margin:0}h2{font-size:19px;margin:22px 0 12px;color:#746574}.pill{background:#f2dfe7;border-radius:50px;padding:10px 15px;color:#87526a;font-weight:700}.card{background:#fff;border:1px solid #eedfe5;border-radius:20px;padding:17px;margin:12px 0;box-shadow:0 4px 15px #6042530b}.hero{background:linear-gradient(125deg,#f47aa8,#f05c94);color:#fff;padding:22px;border-radius:22px}.hero small{opacity:.9}.hero strong{display:block;font-size:24px;margin:7px 0}.muted{color:#8b7a84;font-size:13px}.days{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.day{padding:12px 5px;border-radius:15px;background:#fff;border:1px solid #eadde2;color:#4e4049;text-align:center;font-size:12px}.day strong{display:block;font-size:13px;margin-top:4px}.day.active{background:#f05c94;color:#fff;border-color:#f05c94}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;text-align:center}.calendar .dow{font-size:11px;color:#93838d;padding:5px}.calendar .date{border-radius:12px;background:#fff;border:1px solid #f1e7ea;padding:9px 0;min-height:54px;font-size:13px}.date i{display:block;font-style:normal;font-size:12px;margin-top:4px;color:#bb7b93}.date.done{background:#e9f4ed}.date.current{outline:2px solid #f05c94}.ex{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #f3e7ec}.ex:last-child{border:0}.thumb{width:52px;height:52px;border-radius:16px;background:#fdf1f5;border:1px solid #f8dbe6;display:grid;place-items:center;font-size:25px;flex:none;overflow:hidden}.chev{color:#c7c7cc;font-size:24px;flex:none;padding:0 4px}.gear{background:#fff;border:1px solid #ececf0;border-radius:12px;width:40px;height:40px;display:grid;place-items:center;color:#8e8e93;padding:0}.thumb img{width:100%;height:100%;object-fit:cover}.exname{font-weight:700;font-size:14px}.exnote{font-size:12px;color:#8e7885;margin-top:4px}.circle{width:44px;height:44px;border:3px solid #f05c94;border-radius:50%;display:grid;place-items:center;color:#f05c94;font-size:13px;font-weight:800;flex:none}.action{width:100%;background:#f05c94;color:white;padding:16px;border-radius:14px;font-weight:800;margin:10px 0}.secondary{background:#fff;color:#8d5871;border:1px solid #e4cbd5}.back{background:#fff;padding:9px 13px;border-radius:12px;color:#875b70}.sets{display:grid;grid-template-columns:30px 1fr 1fr 42px;gap:8px;align-items:center;margin:8px 0}.sets input{min-width:0;width:100%;border:1px solid #e6d9df;border-radius:10px;padding:11px;background:#fff}.sets .check{border-radius:10px;padding:11px 0;background:#f3e4eb;color:#87516c}.sets .check.ok{background:#dbeee2;color:#277b55}.timer{font-size:36px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin:12px 0}.sticky{position:sticky;bottom:8px;background:#ffffffe8;padding:8px 0}.notice{padding:12px;border-radius:12px;background:#fff3f5;color:#95586d;font-size:13px}.photo{width:100%;max-height:220px;object-fit:cover;border-radius:13px;margin-top:9px}.hide{display:none}#status{font-size:12px;color:#8d6b7a;text-align:center;margin:5px}.small{font-size:12px}.progress{height:7px;background:#f2e3e9;border-radius:8px;overflow:hidden}.progress span{display:block;height:100%;background:#f05c94;transition:width .2s}
</style></head><body><main id="root"></main><script>
const PLAN=[
{name:'Ягодицы база',emoji:'🍑',time:54,ex:[
['Ягодичный мост в тренажёре Смита','4×10 · 20 кг','🏋️',4,10,20,'Вес блинов, без веса грифа'],
['Румынская тяга с гантелями','3×10 · 20 кг','🏋️',3,10,20,''],
['Жим ногами горизонтальной платформы','3×12 · 68 кг','🦵',3,12,68,''],
['Разведение ног сидя в наклоне','3×15 · 78 кг','🦵',3,15,78,''],
['Подтягивания в Гравитроне широким прямым хватом','3×10','💪',3,10,'',''],
['Вертикальная тяга широким прямым хватом к груди','3×12','💪',3,12,'','']]},
{name:'Ягодицы шлифовка',emoji:'✨',time:55,ex:[
['Болгарские приседания','3×8','🦵',3,8,'',''],
['Ягодичный мост в тренажёре Смита','3×12 · 20 кг','🏋️',3,12,20,''],
['Разгибание бедра в блоке стоя','3×12 · 20 кг','🍑',3,12,20,''],
['Сгибание ног лёжа','3×12 · 20 кг','🦵',3,12,20,''],
['Сгибание ног сидя','3×12','🦵',3,12,'',''],
['Горизонтальная тяга блока сидя узким хватом','3×12 · 10 кг','💪',3,12,10,''],
['Разведение рук в тренажёре','3×15 · 10 кг','💪',3,15,10,'']]},
{name:'Кардио',emoji:'🏃‍♀️',time:30,ex:[['Беговая дорожка','30 мин · комфортный темп','🏃‍♀️',1,30,'','Минуты вместо повторений']]}];
const START='2026-10-15',END='2026-10-31',KEY='alina-workout-journal-2026-v1';
const DAY_NAMES=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const GYM_DAYS=(()=>{try{const list=JSON.parse(localStorage.getItem('alina-habits-v1')||'null');const g=Array.isArray(list)&&list.find(h=>h.id==='gym');if(g&&Array.isArray(g.days)&&g.days.length)return g.days.slice().sort()}catch(e){}return [1,3,6]})();
const schedule=(()=>{const out=[];const d=new Date(2026,9,15,12);while(true){const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');if(k>END)break;if(GYM_DAYS.includes(d.getDay()))out.push(k);d.setDate(d.getDate()+1)}return out})();
let data={logs:{},session:null};try{let d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&d.logs)data=d}catch(e){}
let screen='home',sel=0,photoURL='',ticker=null;
const $=id=>document.getElementById(id),save=()=>{localStorage.setItem(KEY,JSON.stringify(data));syncParent()};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateNow(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function elapsed(){return data.session?Math.floor((Date.now()-data.session.start)/1000):0}
function duration(t){return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
function syncParent(){try{window.parent.postMessage({type:'alina-workout-journal-v1',logs:data.logs},location.origin)}catch(e){}}
function db(){return new Promise((resolve,reject)=>{let req=indexedDB.open('alina-workout-photos',1);req.onupgradeneeded=()=>req.result.createObjectStore('photos');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function putPhoto(key,file){let d=await db();return new Promise((ok,no)=>{let tx=d.transaction('photos','readwrite');tx.objectStore('photos').put(file,key);tx.oncomplete=()=>{d.close();ok()};tx.onerror=()=>no(tx.error)})}
async function getPhoto(key){let d=await db();return new Promise((ok,no)=>{let tx=d.transaction('photos');let req=tx.objectStore('photos').get(key);req.onsuccess=()=>{d.close();ok(req.result)};req.onerror=()=>no(req.error)})}
function getIndex(date){return schedule.indexOf(date)%3}
function summary(){let count=Object.keys(data.logs).filter(d=>data.logs[d].photo).length;return count+' из '+schedule.length+' тренировок подтверждено фото'}
function render(){let h='<header><button class="back" onclick="goHome()">‹ Назад</button><h1>Тренировки</h1><button class="gear" onclick="openSettings()" aria-label="Настройки"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button></header>';
if(screen==='home'){h+='<div class="hero"><small>МОЯ ПРОГРАММА · С 15 ОКТЯБРЯ</small><strong>Рост ягодиц</strong><div>'+summary()+'</div></div><h2>Три тренировочных дня</h2><div class="days">'+PLAN.map((p,i)=>'<button class="day '+(sel===i?'active':'')+'" onclick="selectDay('+i+')">'+p.emoji+'<strong>'+(i+1)+' · '+p.name+'</strong><span>'+p.time+' мин</span></button>').join('')+'</div><h2>Октябрь 2026</h2><div class="card"><div class="calendar">'+['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>'<div class="dow">'+x+'</div>').join('')+Array.from({length:35},(_,i)=>{let n=i-2;if(n<1||n>31)return '<div></div>';let ds='2026-10-'+String(n).padStart(2,'0'),si=schedule.indexOf(ds),done=data.logs[ds]?.photo;return '<div class="date '+(done?'done':'')+' '+(ds===dateNow()?'current':'')+'">'+n+(si>=0?'<i>'+(done?'✓':'🏋️')+'</i>':'')+'</div>'}).join('')+'</div></div><h2>'+PLAN[sel].emoji+' '+PLAN[sel].name+'</h2>'+exList(sel,false)+'<button class="action" onclick="begin()">▶ Начать тренировку</button><p class="muted">График: '+GYM_DAYS.map(d=>DAY_NAMES[d]).join(', ')+' — как у привычки «Спортзал» в «Моей неделе». Для отметки выполнения необходим фотоотчёт.</p>';}
if(screen==='session'){let ss=data.session,plan=PLAN[ss.day];h+='<div class="hero"><small>ТРЕНИРОВКА ИДЁТ</small><strong>'+plan.name+'</strong><div id="timer" class="timer">'+duration(elapsed())+'</div><div class="small">Таймер идёт с момента нажатия «Начать»</div></div><div class="card"><div class="muted">Дата тренировки</div><strong>'+esc(ss.date)+'</strong></div>'+exList(ss.day,true)+'<div class="card"><h2 style="margin-top:0">📸 Фотоотчёт</h2><p class="muted">Сделай фото в спортзале или выбери снимок. Без него завершить тренировку нельзя.</p><input id="photoInput" type="file" accept="image/*" capture="environment" onchange="previewPhoto(this)"><div id="photoPreview">'+(ss.photoReady?'✓ Фото выбрано':'')+'</div></div><div class="sticky"><button class="action" onclick="finish()">✓ Завершить с фотоотчётом</button><button class="action secondary" onclick="pauseSession()">Закрыть, сохранив тренировку</button></div>';}
if(screen==='history'){h+='<h2>Мои тренировки</h2>'+Object.entries(data.logs).sort((a,b)=>b[0].localeCompare(a[0])).map(([d,l])=>'<div class="card"><strong>'+esc(d)+' · '+esc(PLAN[l.day]?.name||'Тренировка')+'</strong><div class="muted">'+duration(l.seconds||0)+' · '+(l.photo?'📸 Фотоотчёт ✓':'Нет фотоотчёта')+'</div><button class="pill" style="margin-top:10px" onclick="viewPhoto(\''+d+'\')">Посмотреть фото</button><div id="pic-'+d+'"></div></div>').join('');}
$('root').innerHTML=h;if(screen==='session')updateTimer()}
function exList(idx,editable){let p=PLAN[idx],ss=data.session;return '<div class="card">'+p.ex.map((e,i)=>{let sets=editable?(ss.sets[i]||[]):[];return '<div class="ex"><div class="thumb" aria-hidden="true">'+e[2]+'</div><div style="flex:1;min-width:0"><div class="exname">'+esc(e[0])+'</div><div class="exnote">'+esc(e[1])+(e[6]?' · '+esc(e[6]):'')+'</div></div>'+(editable?'<div class="circle">'+sets.filter(x=>x.done).length+'/'+sets.length+'</div>':'<div class="chev">›</div>')+'</div>'+(editable?'<div style="padding:4px 0 16px">'+sets.map((x,j)=>'<div class="sets"><span class="muted">'+(j+1)+'</span><input aria-label="Вес" placeholder="кг" type="number" inputmode="decimal" value="'+esc(x.kg)+'" onchange="setValue('+i+','+j+',\'kg\',this.value)"><input aria-label="Повторы" placeholder="'+(idx===2?'мин':'раз')+'" type="number" inputmode="numeric" value="'+esc(x.reps)+'" onchange="setValue('+i+','+j+',\'reps\',this.value)"><button class="check '+(x.done?'ok':'')+'" onclick="toggleSet('+i+','+j+')">'+(x.done?'✓':'○')+'</button></div>').join('')+'<button class="pill small" onclick="addSet('+i+')">+ Подход</button></div>':'')}).join('')+'</div>'}
function goHome(){screen='home';render()}function openSettings(){try{window.parent.postMessage({type:'alina-open-settings',from:'workout'},location.origin)}catch(e){}}function selectDay(i){sel=i;render()}
function begin(){if(data.session){screen='session';render();return}let d=dateNow(),day=schedule.includes(d)?getIndex(d):sel;data.session={start:Date.now(),date:d,day,sets:PLAN[day].ex.map(e=>Array.from({length:e[3]},()=>({kg:e[5]||'',reps:e[4],done:false}))),photoReady:false};screen='session';save();render()}
function setValue(i,j,k,v){data.session.sets[i][j][k]=v;save()}function toggleSet(i,j){data.session.sets[i][j].done=!data.session.sets[i][j].done;save();render()}function addSet(i){data.session.sets[i].push({kg:'',reps:'',done:false});save();render()}
function updateTimer(){clearInterval(ticker);ticker=setInterval(()=>{if(screen==='session'&&$('timer'))$('timer').textContent=duration(elapsed());else clearInterval(ticker)},1000)}
function pauseSession(){screen='home';render()}
async function previewPhoto(input){let file=input.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){alert('Нужно изображение');return}try{await putPhoto('draft',file);data.session.photoReady=true;save();let el=$('photoPreview');el.textContent='✓ Фото прикреплено';let url=URL.createObjectURL(file);el.innerHTML='<img class="photo" alt="Фотоотчёт" src="'+url+'">'}catch(e){alert('Не удалось сохранить фото: '+e.message)}}
async function finish(){let ss=data.session;if(!ss?.photoReady){alert('Сначала приложи фотоотчёт из спортзала. Без него тренировка не засчитывается.');return}try{let file=await getPhoto('draft');if(!file)throw Error('Файл фото не найден');await putPhoto(ss.date,file);data.logs[ss.date]={date:ss.date,day:ss.day,seconds:elapsed(),sets:ss.sets,photo:true};data.session=null;save();screen='home';render();alert('Тренировка сохранена с фотоотчётом 🌸')}catch(e){alert('Фото не сохранено: '+e.message)}}
async function viewPhoto(date){try{let f=await getPhoto(date);if(f){let el=$('pic-'+date);el.innerHTML='';let img=document.createElement('img');img.className='photo';img.src=URL.createObjectURL(f);el.appendChild(img)}else alert('Фото не найдено на этом устройстве')}catch(e){alert(e.message)}}
if(data.session)screen='session';render();syncParent();
</script></body></html>
