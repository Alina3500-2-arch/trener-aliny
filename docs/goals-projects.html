<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Цели и проекты</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1c1c1e;background:#ffffff}*{box-sizing:border-box}body{margin:0;padding:calc(max(env(safe-area-inset-top),50px) + 10px) 15px 110px}h1{font:700 30px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;margin:4px 0 8px}h2{font-size:19px;margin:8px 0}p{line-height:1.5}.sub{color:#9b7c8d;font-size:13px;margin:0 0 19px}.card{background:#fff;border:1px solid #eddee6;border-radius:20px;padding:16px;margin:11px 0;box-shadow:0 6px 20px #aa789012}.title{font-size:17px;font-weight:750}.muted{font-size:12px;color:#987e8c;margin:7px 0}.btn{border:0;border-radius:12px;padding:11px 15px;background:#b77994;color:#fff;font:700 13px -apple-system,sans-serif}.btn.secondary{background:#f6e8ee;color:#925c76}.btn.plain{background:#fff;color:#9b647f;border:1px solid #ead6df}.actions{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.pill{display:inline-block;background:#f8ebf0;color:#9d6380;border-radius:50px;padding:6px 10px;font-size:11px;font-weight:700}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.progress{height:8px;background:#f2e6ec;border-radius:10px;overflow:hidden;margin:13px 0}.progress>span{height:100%;display:block;background:#bb7b96;border-radius:10px}.field{display:flex;flex-direction:column;gap:5px;margin:10px 0;font-size:12px;font-weight:700;color:#765b6a}.field input,.field textarea,.field select{border:1px solid #e9d8e1;background:#fffafd;border-radius:12px;padding:12px;font:14px -apple-system,sans-serif;color:#1c1c1e;width:100%;min-width:0}.field textarea{min-height:65px;resize:vertical}.task{border:1px solid #f1e4ea;background:#fffcfd;border-radius:14px;padding:12px;margin:8px 0}.task.done{opacity:.66}.task.done .taskname{text-decoration:line-through}.check{width:28px;height:28px;border:2px solid #cb96aa;border-radius:9px;background:#fff;color:#b36b8b;font-size:19px;flex:none}.check.on{background:#c38aa1;color:white}.taskname{font-weight:700;font-size:14px}.timer{font-variant-numeric:tabular-nums;font-size:22px;font-weight:800;color:#b06b8b}.empty{color:#9a8490;font-size:14px;padding:15px 0}.rule{background:#f9edf1;border-radius:15px;padding:13px;margin:13px 0}.rule strong{font-size:14px}.rule p{margin:5px 0 0;font-size:12px;color:#8b6d7b}.back{background:#fff;border:1px solid #e8d6df;color:#9b6b80;border-radius:12px;padding:9px 12px}.small{font-size:11px}.alert{background:#fff4f3;color:#ad6766;padding:11px;border-radius:12px;font-size:12px}.link{border:0;background:transparent;color:#b06e8c;font-size:13px;font-weight:700;padding:6px}
</style></head><body><main id="root"></main><script>
const KEY='alina-goals-projects-v1',END='2026-10-31',NAMES=[['agency','🤝','Агентство с Сашей'],['albina','🌷','Проект с Альбиной'],['elina','💼','Работа у Элины'],['extra','💰','Дополнительный заработок']];
let db={goals:[],projects:NAMES.map(([id,icon,name])=>({id,icon,name,until:END,tasks:[]}))};try{let x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&Array.isArray(x.goals)&&Array.isArray(x.projects))db=x}catch(e){}
for(let [id,icon,name] of NAMES)if(!db.projects.some(p=>p.id===id))db.projects.push({id,icon,name,until:END,tasks:[]});
const OCTOBER_PLAN={
 elina:{result:'Оборот 600 000 ₽; личный доход — ориентир 40 000 ₽. Главный приоритет: продажи и оплаты.',tasks:[
 ['Контролировать заявки, предложения, оплаты и повторные продажи','2026-10-31',25],
 ['Проверить воронку продаж и план достижения оборота 600 000 ₽','2026-10-14',45],
 ['Настроить ИИ для ответов клиентам — минимально рабочий сценарий','2026-10-23',90],
 ['Обновить сайт лайтбоксов: цены и примеры работ','2026-10-27',90]]},
 extra:{result:'30 000 ₽ лично за небольшие разовые заказы. Быстрые оплаты, без долгих проектов.',tasks:[
 ['Опубликовать 2–3 простых предложения услуг с быстрым сроком','2026-10-13',60],
 ['Ежедневно искать и откликаться на небольшие оплачиваемые заказы','2026-10-31',30],
 ['Закрыть первые оплаченные заказы на 5–10 тыс. ₽','2026-10-20',90],
 ['Довести оплаченный доход от разовых заказов до 30 000 ₽','2026-10-31',30]]},
 albina:{result:'До 18 октября готова вся воронка; с 19 октября контент-тест. Обучение стартует 2 ноября. Доход октября не планируем.',tasks:[
 ['Новый сайт с рассрочкой','2026-10-18',90],
 ['PDF и голосовые для всех 9 вариантов воронки','2026-10-18',90],
 ['Автосообщение в Директ и переход в Telegram','2026-10-18',60],
 ['Пройти и проверить все 9 путей клиента','2026-10-18',45],
 ['С 19 октября: 3 пробных Reels в неделю','2026-10-25',90],
 ['С 19 октября: 2 карусели в неделю','2026-10-25',90],
 ['Подготовить начало обучения 2 ноября','2026-10-31',45]]},
 agency:{result:'Пилотный проект: выполнять согласованный октябрьский план, проверять гипотезы. Доход в октябре не закладываем.',tasks:[
 ['Перенести согласованные личные пункты из октябрьского плана агентства','2026-10-14',30],
 ['Проверить гипотезы на заявках и продажах без дополнительных затрат','2026-10-31',45]]}
};
const OCTOBER_GOALS=[
 {id:'october-gym-2026',kind:'workouts',icon:'\ud83d\udcaa',name:'Тренировки до конца октября',period:'1 месяц',result:'',tasks:[]},
 {id:'october-food-2026',kind:'meals',icon:'\ud83d\udcdd',name:'Записывать питание каждый день кроме воскресенья',period:'1 месяц',result:'',tasks:[]},
 {id:'october-learning-2026',icon:'🤖',name:'Изучать ИИ и смотреть мотивационные материалы',period:'1 месяц',result:'Практика ИИ и мотивационные материалы 6 дней в неделю',tasks:[]}
];
function seedOctoberPlan(){
 let changed=false;
 for(const [id,plan] of Object.entries(OCTOBER_PLAN)){
   const project=db.projects.find(p=>p.id===id);if(!project)continue;
   if(!project.result){project.result=plan.result;changed=true}
   if(!Array.isArray(project.tasks))project.tasks=[];
   for(const [title,due,limit] of plan.tasks){
     if(project.tasks.some(t=>t.title===title))continue;
     project.tasks.push({id:'oct26-'+id+'-'+plan.tasks.findIndex(t=>t[0]===title),title,due,limit,done:false,spent:0,running:false,result:'',test:'',stop:''});changed=true
   }
 }
 for(const goal of OCTOBER_GOALS){if(!db.goals.some(g=>g.id===goal.id)){db.goals.push(goal);changed=true}}
 if(changed)localStorage.setItem(KEY,JSON.stringify(db));
}
seedOctoberPlan();

/* ===== ЦЕЛЬ №1 — ВСЕГДА ДЕНЬГИ =====
   Первая цель каждого месяца — сколько заработать. Её нельзя удалить, можно
   только поменять сумму. «Заработано» приходит из приложения «Мои деньги»:
   оно кладёт одно число в общее облачное хранилище, мы его читаем.
   В заработок входит весь доход, кроме помощи мужа. */
const MONEY_SYNC='https://trener-aliny-widget.alina-3500-2.workers.dev',MONEY_CACHE='alina-money-cache-v1',DEFAULT_TARGET=60000;
const MONTHS_IN=['январе','феврале','марте','апреле','мае','июне','июле','августе','сентябре','октябре','ноябре','декабре'];
const rub=n=>Math.round(Number(n)||0).toLocaleString('ru-RU')+' \u20bd';
const plural=(n,a,b,c)=>{const m=n%100,k=n%10;return m>=11&&m<=14?c:k===1?a:k>=2&&k<=4?b:c};
function monthKey(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function monthEnd(mk){const [y,m]=mk.split('-').map(Number);return mk+'-'+String(new Date(y,m,0).getDate()).padStart(2,'0')}
function daysLeft(due){if(!/^\d{4}-\d{2}-\d{2}$/.test(due||''))return -1;const [y,m,d]=due.split('-').map(Number);const t=new Date();t.setHours(0,0,0,0);return Math.round((new Date(y,m-1,d)-t)/86400000)}
const isMoney=g=>!!g&&g.kind==='money';
let earned=null;try{const c=JSON.parse(localStorage.getItem(MONEY_CACHE)||'null');if(c&&c.month)earned=c}catch(e){}
function ensureMoneyGoal(){
 const mk=monthKey(),id='income-'+mk;let changed=false;
 const old=db.goals.find(g=>g.id==='october-income-2026');
 if(old&&!isMoney(old)){old.id='income-2026-10';old.kind='money';old.month='2026-10';old.target=DEFAULT_TARGET;
  old.icon='\ud83d\udcb0';old.name='Заработать в октябре';old.due='2026-10-31';
  old.result='';changed=true}
 let g=db.goals.find(x=>x.id===id);
 if(!g){const prev=db.goals.filter(isMoney).sort((a,b)=>a.month<b.month?1:-1)[0];
  g={id,kind:'money',month:mk,icon:'\ud83d\udcb0',target:(prev&&Number(prev.target))||DEFAULT_TARGET,
     name:'Заработать в '+MONTHS_IN[Number(mk.slice(5))-1],due:monthEnd(mk),
     result:'',tasks:[]};
  db.goals.push(g);changed=true}
 const i=db.goals.indexOf(g);if(i>0){db.goals.splice(i,1);db.goals.unshift(g);changed=true}
 if(changed)localStorage.setItem(KEY,JSON.stringify(db));
 return g}
ensureMoneyGoal();
/* ===== ТРЕНИРОВКИ И ПИТАНИЕ СЧИТАЮТСЯ САМИ =====
   Спринт программы — 19–31 октября, те же данные, что в «Моей неделе»:
   тренировка засчитана, когда в дневнике есть фото; день питания — когда
   записаны завтрак, обед и ужин. Цели лежат в том же приложении, поэтому
   читаем напрямую из localStorage, без интернета. */
const SPRINT_FROM='2026-10-19',SPRINT_TO='2026-10-31';
function sprintDays(){const out=[],d=new Date(2026,9,19,12);
 for(;;){const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  if(k>SPRINT_TO)break;out.push([k,d.getDay()]);d.setDate(d.getDate()+1)}
 return out}
function gymDays(){try{const l=JSON.parse(localStorage.getItem('alina-habits-v1')||'null');const g=Array.isArray(l)&&l.find(h=>h.id==='gym');if(g&&Array.isArray(g.days)&&g.days.length)return g.days}catch(e){}return [1,3,6]}
function workoutStat(){
 const gd=gymDays(),plan=sprintDays().filter(d=>gd.indexOf(d[1])>=0).map(d=>d[0]);
 let logs={};try{logs=(JSON.parse(localStorage.getItem('alina-workout-journal-2026-v1')||'{}')||{}).logs||{}}catch(e){}
 return {total:plan.length,done:plan.filter(k=>logs[k]&&logs[k].photo).length,unit:'тренировок'}}
function foodStat(){
 const plan=sprintDays().filter(d=>d[1]!==0).map(d=>d[0]);
 let days=null;
 try{const st=JSON.parse(localStorage.getItem('trener_aliny_state_v1')||'null');
  if(st&&Array.isArray(st.meals)){days={};st.meals.forEach(m=>{if(!m.date)return;(days[m.date]||(days[m.date]={}))[m.type]=true})}}catch(e){}
 if(!days){try{days=JSON.parse(localStorage.getItem('alina-food-days-v1')||'{}')||{}}catch(e){days={}}}
 const full=k=>{const m=days[k];return !!(m&&m.breakfast&&m.lunch&&m.dinner)};
 return {total:plan.length,done:plan.filter(full).length,unit:'дней'}}
const autoStat=g=>g.kind==='workouts'?workoutStat():g.kind==='meals'?foodStat():null;
function ensureAutoGoals(){let changed=false;
 const w=db.goals.find(g=>g.id==='october-gym-2026');
 if(w&&w.kind!=='workouts'){w.kind='workouts';w.name='Тренировки до конца октября';w.due=SPRINT_TO;w.result='';changed=true}
 const f=db.goals.find(g=>g.id==='october-food-2026');
 if(f&&f.kind!=='meals'){f.kind='meals';f.name='Записывать питание каждый день кроме воскресенья';f.due=SPRINT_TO;f.result='';changed=true}
 if(changed)localStorage.setItem(KEY,JSON.stringify(db))}
ensureAutoGoals();
const moneyEarned=g=>(earned&&earned.month===g.month)?Math.max(0,Math.round(earned.earned||0)):0;
function pullMoney(){
 fetch(MONEY_SYNC+'/widget/aline',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{
  const m=j&&j.money;if(!m||!m.month)return;
  const next={month:m.month,earned:Math.round(Number(m.earned)||0),updatedAt:m.updatedAt||Date.now()};
  const same=earned&&earned.month===next.month&&earned.earned===next.earned;
  earned=next;try{localStorage.setItem(MONEY_CACHE,JSON.stringify(next))}catch(e){}
  if(!same){ensureMoneyGoal();render()}
 }).catch(()=>{})}
const MONTHS_SHORT=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
function dueLabel(g){if(g&&/^\d{4}-\d{2}-\d{2}$/.test(g.due||'')){const [y,m,d]=g.due.split('-').map(Number);return 'до '+d+' '+MONTHS_SHORT[m-1]+(y!==new Date().getFullYear()?' '+y:'')}return 'без даты'}
(function migrateDue(){let changed=false;db.goals.forEach(g=>{if(!g.due&&g.period&&g.period!=='Без срока'){g.due='2026-10-31';changed=true}});if(changed)localStorage.setItem(KEY,JSON.stringify(db))})();

let mode=new URLSearchParams(location.search).get('view')==='projects'?'projects':'goals',current=null,editing=null,taskEditing=null;
const $=id=>document.getElementById(id),safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(KEY,JSON.stringify(db));syncWidget()}
function syncWidget(){let data=db.projects.map(p=>({id:p.id,name:p.name,icon:p.icon,total:p.tasks.length,done:p.tasks.filter(t=>t.done).length,top:p.tasks.filter(t=>!t.done).slice(0,3).map(t=>t.title)}));try{window.webkit?.messageHandlers?.projects?.postMessage({projects:data,goals:db.goals.map(g=>{const p=progress(g);return isMoney(g)
  ?{id:g.id,name:g.name+' — '+Math.round(p.total/1000)+' тыс ₽',period:dueLabel(g),due:g.due||'',done:Math.round(p.done/1000),total:Math.round(p.total/1000)}
  :{id:g.id,name:g.name,period:dueLabel(g),due:g.due||'',done:p.done,total:p.total}})})}catch(e){}try{window.parent.postMessage({type:'alina-projects-widget',projects:data},location.origin)}catch(e){}}
function list(){return mode==='projects'?db.projects:db.goals}function item(){return list().find(x=>x.id===current)}
function goalSummary(o){if(mode!=='goals')return '';
 if(isMoney(o)){const d=daysLeft(o.due),fresh=earned&&earned.month===o.month;
  return '<div class="muted">🎯 Цель месяца: '+rub(o.target||DEFAULT_TARGET)+(d>=0?' · осталось '+d+' '+plural(d,'день','дня','дней'):'')+'</div>'
   +'<div class="muted">💳 Из «Моих денег», кроме помощи мужа · '+(fresh&&earned.updatedAt?'обновлено '+new Date(earned.updatedAt).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'жду данные из «Моих денег»')+'</div>'}
 if(o.kind==='workouts'||o.kind==='meals'){const p=progress(o),d=daysLeft(o.due);
  return '<div class="muted">🎯 Программа 19–31 октября: '+p.total+' '+p.unit+(d>=0?' · осталось '+d+' '+plural(d,'день','дня','дней'):'')+'</div>'
   +'<div class="muted">'+(o.kind==='workouts'?'🏋️ Считается сама: тренировка засчитана, когда в дневнике есть фото':'🍽 Считается сам: день засчитан, когда записаны завтрак, обед и ужин')+'</div>'}
 let target=o.id==='october-learning-2026'?'6 дней в неделю':'';return target?'<div class="muted">🎯 Ориентир: '+target+' · Итог подведём после завершения периода</div>':''}
function progress(o){
 const st=autoStat(o);
 if(st)return {total:st.total,done:Math.min(st.done,st.total),pct:st.total?Math.round(Math.min(st.done,st.total)/st.total*100):0,unit:st.unit};
 if(isMoney(o)){const total=Math.max(1,Number(o.target)||DEFAULT_TARGET),done=moneyEarned(o);
  return {total,done,pct:Math.min(100,Math.round(done/total*100)),money:true}}
 let total=o.tasks.length,done=o.tasks.filter(t=>t.done).length;return {total,done,pct:total?Math.round(done/total*100):0}}
function progressLine(p){
 if(p.unit){const left=Math.max(0,p.total-p.done);
  return p.done+' из '+p.total+' '+p.unit+' · '+p.pct+'%'+(left?' · осталось '+left:' · цель закрыта 🎉')}
 if(!p.money)return p.done+' / '+p.total+' шагов выполнено';
 const left=Math.max(0,p.total-p.done);
 return rub(p.done)+' из '+rub(p.total)+' · '+p.pct+'%'+(left?' · ещё '+rub(left):' · цель закрыта 🎉')}
function render(){let o=item();let h='<div class="row"><div><h1>'+(mode==='projects'?'Проекты':'Цели')+'</h1><p class="sub">'+(mode==='projects'?'Четыре направления · до 31 октября':'У каждой цели свой срок')+'</p></div><span style="font-size:26px">🌸</span></div>';
if(!o){if(mode==='projects')h+='<div class="rule"><strong>⚡ Антизадротство: 20/80</strong><p>Сначала проверяем гипотезу. Время ограничено. Результат важнее идеального оформления.</p></div>';h+=list().map(x=>{let p=progress(x);return '<div class="card" onclick="openItem(\''+x.id+'\')"><div class="row"><div><span class="pill">'+(mode==='goals'?safe(dueLabel(x)):'до 31.10')+'</span><div class="title" style="margin-top:9px">'+safe(x.icon||'🎯')+' '+safe(x.name)+'</div></div><span style="color:#b77e99;font-size:25px">›</span></div><div class="progress"><span style="width:'+p.pct+'%"></span></div><div class="muted">'+progressLine(p)+(x.result?' · '+safe(x.result):'')+'</div>'+goalSummary(x)+'</div>'}).join('');if(mode==='goals')h+='<button class="btn" onclick="editItem()">+ Новая цель</button>';else h+='<p class="sub">Открой проект, чтобы поставить конкретную задачу, короткий тест и лимит времени.</p>'}
else{let p=progress(o);h+='<button class="back" onclick="back()">‹ Все '+(mode==='projects'?'проекты':'цели')+'</button><div class="card"><div class="row"><div><span class="pill">'+(mode==='projects'?'до 31 октября':safe(dueLabel(o)))+'</span><h2>'+safe(o.icon||'🎯')+' '+safe(o.name)+'</h2></div><button class="link" onclick="editItem()">✎</button></div>'+(o.result?'<p><strong>Измеримый результат:</strong> '+safe(o.result)+'</p>':'')+'<div class="progress"><span style="width:'+p.pct+'%"></span></div><div class="muted">'+progressLine(p)+'</div>'+goalSummary(o)+'</div>';
if(mode==='projects')h+='<div class="rule"><strong>⏱ 20% усилий → 80% результата</strong><p>Каждая задача: ожидаемый результат → быстрый тест → лимит времени → критерий остановки. Не дорабатываем до проверки.</p></div>';
h+='<div class="row"><h2>'+(mode==='projects'?'Задачи проекта':'План достижения')+'</h2><button class="btn secondary" onclick="editTask()">+ Задача</button></div>';
h+=o.tasks.length?o.tasks.map(t=>'<div class="task '+(t.done?'done':'')+'"><div class="row"><button class="check '+(t.done?'on':'')+'" onclick="toggleTask(\''+t.id+'\')">'+(t.done?'✓':'')+'</button><div style="flex:1"><div class="taskname">'+safe(t.title)+'</div><div class="muted">'+(t.due?'📅 '+safe(t.due)+' · ':'')+'⏱ '+(Number(t.limit)||25)+' мин'+(t.done?' · выполнено':'')+'</div></div><button class="link" onclick="editTask(\''+t.id+'\')">✎</button></div>'+(t.result?'<p class="small"><b>Результат:</b> '+safe(t.result)+'</p>':'')+(t.test?'<p class="small"><b>Быстрый тест:</b> '+safe(t.test)+'</p>':'')+(t.stop?'<p class="small"><b>Достаточно хорошо:</b> '+safe(t.stop)+'</p>':'')+'<div class="row"><span class="timer" id="clock-'+t.id+'">'+clock(t)+'</span><div><button class="btn secondary" onclick="timerTask(\''+t.id+'\')">'+(t.running?'⏸ Пауза':'▶ Старт')+'</button></div></div></div>').join(''):'<p class="empty">Пока задач нет. Добавь первый короткий шаг, который приблизит к результату.</p>'}
if(editing&&editing!=='new'&&isMoney(o)){h+='<div class="card"><h2>Сколько заработать в этом месяце?</h2><label class="field">Сумма, ₽<input id="edit-target" type="number" min="0" step="1000" inputmode="numeric" value="'+(Number(o.target)||DEFAULT_TARGET)+'"></label><p class="muted">Пиши нижнюю планку — сколько точно должно быть на руках. Помощь мужа не считается.</p><div class="actions"><button class="btn" onclick="saveMoney()">Сохранить</button><button class="btn secondary" onclick="cancelEdit()">Отмена</button></div></div>'}
else if(editing){let x=editing==='new'?{name:'',due:END,result:'',icon:'🎯'}:o;h+='<div class="card"><h2>'+(editing==='new'?'Новая цель':'Редактировать')+'</h2><label class="field">Название<input id="edit-name" value="'+safe(x.name)+'" maxlength="120"></label>'+(mode==='goals'?'<label class="field">Срок — до какого числа<input id="edit-due" type="date" value="'+safe(x.due||END)+'"></label><label class="field">Иконка<input id="edit-icon" maxlength="4" value="'+safe(x.icon||'🎯')+'"></label>':'')+'<label class="field">Измеримый результат<textarea id="edit-result" placeholder="Что конкретно должно измениться?">'+safe(x.result||'')+'</textarea></label><div class="actions"><button class="btn" onclick="saveItem()">Сохранить</button>'+(mode==='goals'&&editing!=='new'?'<button class="btn plain" onclick="deleteItem()">Удалить цель</button>':'')+'<button class="btn secondary" onclick="cancelEdit()">Отмена</button></div></div>'}
if(taskEditing){let t=taskEditing==='new'?{title:'',result:'',test:'',stop:'',limit:25,due:END}:o.tasks.find(x=>x.id===taskEditing);h+='<div class="card"><h2>Конкретный шаг</h2><label class="field">Что сделать?<input id="task-title" maxlength="150" value="'+safe(t.title)+'"></label><label class="field">Ожидаемый результат<textarea id="task-result" placeholder="Что получу после выполнения?">'+safe(t.result||'')+'</textarea></label><label class="field">Самый короткий тест<textarea id="task-test" placeholder="Что проверить без большой подготовки?">'+safe(t.test||'')+'</textarea></label><label class="field">Критерий остановки<textarea id="task-stop" placeholder="Когда достаточно хорошо и можно завершить?">'+safe(t.stop||'')+'</textarea></label><div class="row"><label class="field" style="flex:1">Лимит, минут<input id="task-limit" type="number" min="5" max="480" value="'+safe(t.limit||25)+'"></label><label class="field" style="flex:1">Срок<input id="task-due" type="date" value="'+safe(t.due||END)+'"></label></div><div class="actions"><button class="btn" onclick="saveTask()">Сохранить задачу</button><button class="btn secondary" onclick="cancelTask()">Отмена</button>'+(taskEditing!=='new'?'<button class="btn plain" onclick="deleteTask()">Удалить</button>':'')+'</div></div>'}
$('root').innerHTML=h;syncWidget()}
function openItem(id){current=id;editing=null;taskEditing=null;render()}function back(){current=null;editing=null;taskEditing=null;render()}function editItem(){editing=current||'new';render()}function saveMoney(){const o=item();const v=Math.max(0,Math.round(Number($('edit-target').value)||0));if(!v)return alert('Напиши сумму в рублях');o.target=v;editing=null;save();render()}
function deleteItem(){const o=item();if(isMoney(o))return alert('Денежная цель месяца остаётся всегда — можно поменять только сумму.');if(autoStat(o))return alert('Эта цель считается сама по программе 19–31 октября — удалять её не нужно.');if(!o||!confirm('Удалить цель «'+o.name+'»?'))return;db.goals=db.goals.filter(g=>g.id!==o.id);current=null;editing=null;save();render()}function cancelEdit(){editing=null;render()}
function saveItem(){let name=$('edit-name').value.trim();if(!name)return alert('Напиши название');let x=editing==='new'?{id:'goal-'+Date.now(),icon:'🎯',tasks:[]}:item();x.name=name;x.result=$('edit-result').value.trim();if(mode==='goals'){x.due=$('edit-due').value||END;x.period=dueLabel(x);x.icon=$('edit-icon').value.trim()||'🎯'}if(editing==='new'){db.goals.push(x);current=x.id}editing=null;save();render()}
function editTask(id){taskEditing=id||'new';render()}function cancelTask(){taskEditing=null;render()}
function saveTask(){let title=$('task-title').value.trim();if(!title)return alert('Напиши конкретное действие');let t=taskEditing==='new'?{id:'task-'+Date.now(),done:false,spent:0,running:false}:item().tasks.find(x=>x.id===taskEditing);t.title=title;t.result=$('task-result').value.trim();t.test=$('task-test').value.trim();t.stop=$('task-stop').value.trim();t.limit=Math.max(5,Math.min(480,Number($('task-limit').value)||25));t.due=$('task-due').value;if(taskEditing==='new')item().tasks.push(t);taskEditing=null;save();render()}
function deleteTask(){if(!confirm('Удалить задачу?'))return;item().tasks=item().tasks.filter(x=>x.id!==taskEditing);taskEditing=null;save();render()}
function toggleTask(id){let t=item().tasks.find(x=>x.id===id);t.done=!t.done;if(t.running){t.spent=(t.spent||0)+Math.floor((Date.now()-t.started)/1000);t.running=false}save();render()}
function timerTask(id){let t=item().tasks.find(x=>x.id===id);if(t.running){t.spent=(t.spent||0)+Math.floor((Date.now()-t.started)/1000);t.running=false}else{t.running=true;t.started=Date.now()}save();render()}
function clock(t){let secs=(t.spent||0)+(t.running?Math.max(0,Math.floor((Date.now()-t.started)/1000)):0);return String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0')+' / '+t.limit+' мин'}
pullMoney();setInterval(pullMoney,300000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){render();pullMoney()}});
window.addEventListener('storage',e=>{if(['alina-workout-journal-2026-v1','trener_aliny_state_v1','alina-food-days-v1','alina-habits-v1'].indexOf(e.key)>=0)render()});
setInterval(()=>{if(!current)return;let o=item();if(!o)return;for(let t of o.tasks){let el=$('clock-'+t.id);if(el&&t.running)el.textContent=clock(t)}},1000);render();
