<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>Мои дела</title><style>
:root{color-scheme:light;--bg:#ffffff;--ink:#1c1c1e;--muted:#8e8e93;--rose:#f05c94;--line:#ececf0;--tile:#f7f6f8;--ring:#c2c2cc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden}

header{flex:none;padding:2px 2px 12px}
.hrow{display:flex;align-items:center;gap:9px}
.hicon{width:22px;height:22px;color:var(--rose);flex:none}

.hcount{margin-left:auto;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.hplus{width:32px;height:32px;border-radius:50%;border:0;background:var(--rose);color:#fff;font-size:21px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0 0 2px;box-shadow:0 3px 10px rgba(240,92,148,.28)}

.dialog-shade{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.dialog{background:#fff;border-radius:22px 22px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));width:100%;max-width:520px;box-shadow:0 -8px 30px rgba(0,0,0,.08)}
.dialog h2{font-size:18px;font-weight:600;margin:0 0 12px}
.dialog input,.dialog select{display:block;width:100%;border:0;border-radius:12px;padding:13px 14px;margin:0 0 10px;color:var(--ink);background:#f2f2f7;font-size:16px;font-family:inherit}
.dialog .tlabel{font-size:12px;color:var(--muted);margin:2px 2px 6px}
.dialog .actions{display:flex;gap:10px;margin-top:6px}
.dialog button{flex:1;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:600;font-family:inherit;background:var(--rose);color:#fff}

body{font:14px -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;background:linear-gradient(#fff,#fff6f9);color:var(--ink);padding:14px 12px 10px;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
.diary{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:8px}
.day{min-height:0;display:flex;flex-direction:column;background:#fdf1f5;border-radius:18px;padding:10px 9px 6px;border:1.4px solid #f8dbe6}
.day.today{border-color:#f05c94;background:#fff}
.day-head{display:flex;align-items:baseline;gap:4px;flex:none;padding:0 1px 6px}
.dname{font-size:15px;font-weight:600}.day.today .dname{color:var(--rose)}
.dnum{font-size:12px;color:var(--muted)}
.dcount{margin-left:auto;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.lines{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.line{display:flex;align-items:flex-start;gap:6px;padding:6px 0;border-top:1px solid rgba(240,92,148,.12);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.line:first-child{border-top:0;padding-top:2px}
.dot{flex:none;margin-top:1px;width:17px;height:17px;border-radius:50%;border:1.5px solid var(--ring);background:#fff;padding:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:700}

.line.done .tm{color:var(--muted)}

.line.overdue:not(.done) .dot{border-color:#e5484d}

.line.moved .txt{color:#98989d}.line.moved .dot{border-color:#e5e5ea;color:#aeaeb2;background:#f7f7f9;font-size:10px}.movedto{font-size:11px;color:#98989d}
.line.done .dot{background:var(--rose);border-color:var(--rose)}
.line.overdue .dot{border-color:#e5484d}
.line.overdue .txt{color:#c62f3a}
.line.missed .dot{background:#fff;border-color:#f3c3c6;color:#e5484d;font-size:10px;font-weight:800}
.line.missed .txt{color:#a1a1a6;text-decoration:line-through;text-decoration-color:#e8a3a8}
.line.frozen{cursor:default}
.note{font-size:10.5px;color:#a1a1a6;font-weight:500;white-space:nowrap;display:inline-block;text-decoration:none}

.line.overdue .note{color:#e5484d}
.day.past{background:#faf7f8;border-color:#f1e6ea}
.empty-past{flex:1;display:grid;place-items:center;color:#d1d1d6;font-size:18px}
.diary.dayview{display:block;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:14px}
.weeknav{flex:none;display:flex;align-items:center;gap:8px;margin:0 0 10px}

.weeknav #wk-prev,.weeknav #wk-next{width:44px;font-size:22px;line-height:1;padding:0 0 3px}
.weeknav #wk-title{flex:1;color:var(--ink);font-size:14px;background:#fdf1f5}
.diary:not(.dayview){grid-template-rows:repeat(2,minmax(0,1fr)) minmax(0,.62fr)}.diary:not(.dayview) .day:nth-child(7){grid-column:1/-1}
.cals{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .cd{color:var(--rose)}.cal.none{background:#f6f6f8;border-color:#ececf0}.cal.none .cd{color:#c4c4cc}.cal.none .cn,.cal.none .cm{color:#a8a8b0}
.cal.sel .cd,.cal.sel .cn,.cal.sel .cm{color:#fff}
.cal{border:1.4px solid #f8dbe6;background:#fdf1f5;border-radius:16px;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:1px;font-family:inherit;color:var(--ink)}
.cal.today:not(.sel){border-color:var(--rose)}
.cal.sel{background:var(--rose);border-color:var(--rose);color:#fff}
.cn{font-size:12px;font-weight:600}.cd{font-size:19px;font-weight:700}.cm{font-size:10.5px;opacity:.75;font-variant-numeric:tabular-nums}
.dcard,.ycard{margin-top:12px;background:#fff;border:1.4px solid #f8dbe6;border-radius:20px;padding:14px 14px 10px}
.ycard{background:#fffaf0;border-color:#f5e2b8}
.dtitle{font-size:19px;font-weight:700}.dsub{font-size:13px;color:var(--muted);margin-left:6px;font-weight:500}
.bar{height:8px;border-radius:99px;background:#f7e1ea;margin:10px 0 8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--rose);border-radius:99px;transition:width .3s}
.msg{font-size:14px;line-height:1.4;background:#fff3f7;border-radius:14px;padding:10px 12px;margin:0 0 6px;color:#9f4469}
.msg.good{background:#eaf8ef;color:#2f7a4d}
.dayview .line{padding:11px 0}.dayview .line:first-child{padding-top:6px}.dayview .dot{width:24px;height:24px;font-size:13px;margin-top:0}.dayview .txt{font-size:16px;line-height:1.35}.dayview .tm{display:inline;margin-right:6px;font-size:13px}.dayview .note{font-size:12px}
.add-wide{width:100%;margin:6px 0 4px;border:1px dashed #efc3d4;background:transparent;color:#c7869f;border-radius:14px;padding:11px;font-size:15px;font-family:inherit}
.ytitle{font-size:14px;font-weight:600;line-height:1.35;margin-bottom:6px;color:#8a6a1f}
.yrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid #f5e2b8}.yrow:first-of-type{border-top:0}
.yrow span{flex:1;font-size:15px}.yb{border:0;background:var(--rose);color:#fff;border-radius:12px;padding:9px 13px;font-size:14px;font-weight:600;font-family:inherit}
.hint-line{flex:none;font-size:11px;color:var(--muted);text-align:center;padding-top:8px}
</style></head><body><header><div class="hrow"><svg class="hicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3.5 6.5 1.5 1.5 3-3"/><path d="m3.5 13.5 1.5 1.5 3-3"/><circle cx="5.5" cy="19.5" r="1.5"/><path d="M11 6.5h10M11 13.5h10M11 19.5h10"/></svg><h1>Планировщик</h1><span class="hcount" id="hcount"></span><button class="hplus" id="add-today" aria-label="Добавить дело">+</button></div><button id="siri-import" class="siri">↻ Подтянуть из Напоминаний</button><button id="mode-toggle" class="siri" style="margin-left:16px"></button></header><div class="weeknav" id="weeknav"><button id="wk-prev" aria-label="Прошлая неделя">‹</button><button id="wk-title"></button><button id="wk-next" aria-label="Следующая неделя">›</button></div><div class="diary" id="diary"></div><div class="hint-line">Нажми — отметить · подержи — удалить · <span style="color:#e5484d">✕</span> не сделано в срок</div><div id="dialog-root"></div><script src="planner-core.js"></script><script>
"use strict";
const KEY="alina-daily-tasks-v1", $=id=>document.getElementById(id),dateKey=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-");
let db={};function reloadDb(){try{db=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){db={}}}reloadDb();
let today=new Date(),monday=new Date(today);monday.setDate(today.getDate()-((today.getDay()+6)%7));
const names=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];let weekOffset=0;
function buildDays(){return names.map((name,i)=>{let d=new Date(monday.getFullYear(),monday.getMonth(),monday.getDate()+weekOffset*7+i,12);return {name,num:d.getDate(),date:dateKey(d)}})}
let days=buildDays();
function weekTitle(){const a=days[0].date,b=days[6].date,f=k=>new Intl.DateTimeFormat("ru-RU",{day:"numeric",month:"short"}).format(keyDate(k)).replace(".","");return weekOffset===0?"Эта неделя · "+f(a)+" – "+f(b):weekOffset===1?"Следующая · "+f(a)+" – "+f(b):weekOffset===-1?"Прошлая · "+f(a)+" – "+f(b):f(a)+" – "+f(b)}
function shiftWeek(n){const idx=Math.max(0,days.findIndex(d=>d.date===sel));weekOffset+=n;days=buildDays();const tk=dateKey(new Date());sel=days.some(d=>d.date===tk)?tk:days[idx].date;render()}
let selected=null;
const byTime=arr=>arr.map((t,n)=>({t,n})).sort((a,b)=>((a.t.time?0:1)-(b.t.time?0:1))||String(a.t.time||"").localeCompare(String(b.t.time||""))||a.n-b.n).map(x=>x.t);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
if(PlannerCore.migrate(db))localStorage.setItem(KEY,JSON.stringify(db));
function sync(){let payload=PlannerCore.payload(db,dateKey(new Date()));try{window.webkit?.messageHandlers?.tasks?.postMessage(payload)}catch(e){}try{window.parent.postMessage({type:"dailyTasks",payload},"*")}catch(e){}}
function persist(){localStorage.setItem(KEY,JSON.stringify(db));sync()}
let mode="day",sel=null;try{mode=localStorage.getItem("alina-tasks-mode")==="week"?"week":"day"}catch(e){}
const RKEY="alina-my-routine-v1",FKEY="alina-fines-from-2026-10-19-v1",SPRINT=["2026-10-19","2026-10-31"];
const DEF_HABITS=[{id:"wake",title:"Подъём",icon:"🌅",days:[1,2,3,4,5,6]},{id:"affirm",title:"Аффирмации",icon:"🌷",days:[1,2,3,4,5,6]},{id:"ai",title:"Обучение ИИ",icon:"💻",days:[2,4,6]},{id:"motivation",title:"Подкаст",icon:"🎧",days:[1,3,5]},{id:"money",title:"Шаг к доходу",icon:"💰",days:[2,4,6]},{id:"read",title:"Книга 20 стр",icon:"📖",days:[1,2,3,4,5,6]}];
const keyDate=k=>{const p=k.split("-").map(Number);return new Date(p[0],p[1]-1,p[2],12)};
const shiftKey=(k,n)=>{const d=keyDate(k);d.setDate(d.getDate()+n);return dateKey(d)};
const longDate=k=>new Intl.DateTimeFormat("ru-RU",{day:"numeric",month:"long"}).format(keyDate(k));
function readJson(k,def){try{const v=JSON.parse(localStorage.getItem(k)||"null");return v==null?def:v}catch(e){return def}}
// Вчерашние привычки из «Моего режима», которые не отмечены (спортзал и питание считаются сами, их не трогаем).
function missedHabits(day){
 if(day<SPRINT[0]||day>SPRINT[1]||keyDate(day).getDay()===0)return [];
 const st=readJson(RKEY,{}),rec=(st.days||{})[day]||{};if(rec.paused)return [];
 let hs=readJson("alina-habits-v1",null);hs=Array.isArray(hs)&&hs.length?hs.filter(h=>h&&h.id&&h.title&&Array.isArray(h.days)):DEF_HABITS;
 const dow=keyDate(day).getDay();
 return hs.filter(h=>h.id!=="gym"&&h.id!=="food"&&h.days.includes(dow)).filter(h=>h.id==="read"?Number(rec.pages||0)<20:!(rec.checks&&rec.checks[h.id])).map(h=>({id:h.id,title:h.title,icon:h.icon||"✨"}));
}
function markHabit(day,id){
 const st=readJson(RKEY,{days:{}});st.days=st.days||{};const r=st.days[day]=st.days[day]||{checks:{},pages:0,paused:false,moneyNote:"",selfNote:""};r.checks=r.checks||{};
 if(id==="read")r.pages=Math.max(20,Number(r.pages||0));else r.checks[id]=true;
 localStorage.setItem(RKEY,JSON.stringify(st));
 const fl=readJson(FKEY,null);if(fl&&fl.days&&fl.days[day]&&Array.isArray(fl.days[day].missed)){fl.days[day].missed=fl.days[day].missed.filter(x=>x.id!==id);localStorage.setItem(FKEY,JSON.stringify(fl))}
}
function render(){mode==="day"?renderDay():renderWeek()}
function renderDay(){
 const root=$("diary"),todayKey=dateKey(new Date()),v=PlannerCore.view(db,todayKey,days),c=PlannerCore.counts(v);
 if(!sel||!days.some(d=>d.date===sel))sel=days.some(d=>d.date===todayKey)?todayKey:days[0].date;
 const liveOf=d=>d.items.filter(i=>i.state!=="missed"),mark={open:"",done:"✓",overdue:"",missed:"✕"};
 const strip=v.map(d=>{const l=liveOf(d),n=l.filter(i=>i.state==="done").length;return '<button class="cal'+(d.date===sel?' sel':'')+(d.isToday?' today':'')+(d.items.length?'':' none')+'" data-sel="'+d.date+'"><span class="cn">'+d.label+'</span><span class="cd">'+d.num+'</span><span class="cm">'+(l.length?(n===l.length?'✓':n+'/'+l.length):'·')+'</span></button>'}).join('');
 const D=v.find(d=>d.date===sel),l=liveOf(D),n=l.filter(i=>i.state==="done").length,total=l.length,pct=total?Math.round(100*n/total):0;
 const when=sel===todayKey?"Сегодня":sel===shiftKey(todayKey,-1)?"Вчера":D.label;
 let msg="",good=false;
 if(sel>todayKey){msg=total?"Запланировано дел: "+total+".":"Пока пусто — можно запланировать заранее."}
 else if(sel<todayKey){if(!total)msg="В этот день дел не было.";else if(n===total){msg="В тот день ты сделала всё 💗";good=true}else msg="Не всё удалось — невыполненное перенеслось на сегодня."}
 else if(!total)msg="На сегодня дел нет. Наверное, ты ещё не поставила задачу — добавь, пока день не начался 🌷";
 else if(n===total){msg="Молодец! Всё на сегодня сделано 🎉";good=true}
 else if(n>0)msg="Уже "+n+" из "+total+" — так держать!";
 else msg="Начни с самого лёгкого: первая галочка тянет за собой остальные.";
 const rows=D.items.length?D.items.map(i=>'<div class="line '+i.state+(i.tappable?'':' frozen')+'" data-day="'+i.day+'" data-id="'+esc(i.id)+'"><span class="dot">'+mark[i.state]+'</span><span class="txt">'+(i.time?'<span class="tm">'+esc(i.time)+'</span>':'')+(i.state==="overdue"?'<span class="late">!</span>':'')+esc(i.title)+(i.note?'<span class="note"> '+esc(i.note)+'</span>':'')+'</span></div>').join(""):"";
 const y=shiftKey(todayKey,-1),miss=sel===todayKey?missedHabits(y):[];
 const ycard=miss.length?'<div class="ycard"><div class="ytitle">Вчера, '+longDate(y)+', не отмечено. Если сделала — нажми, я поставлю галочку:</div>'+miss.map(h=>'<div class="yrow"><span>'+esc(h.icon)+' '+esc(h.title)+'</span><button class="yb" data-habit="'+esc(h.id)+'" data-hday="'+y+'">Сделала ✓</button></div>').join("")+'</div>':"";
 root.className="diary dayview";
 root.innerHTML='<div class="cals">'+strip+'</div><div class="dcard"><div><span class="dtitle">'+when+'</span><span class="dsub">'+longDate(sel)+'</span></div>'+(total?'<div class="bar"><i style="width:'+pct+'%"></i></div>':'<div style="height:8px"></div>')+'<div class="msg'+(good?' good':'')+'">'+msg+'</div>'+(rows?'<div class="lines" style="overflow:visible">'+rows+'</div>':"")+(sel>=todayKey?'<button class="add-wide" data-add="'+sel+'">+ Добавить дело</button>':"")+'</div>'+ycard;
 root.querySelectorAll("[data-sel]").forEach(b=>b.onclick=()=>{sel=b.dataset.sel;render()});
 root.querySelectorAll("[data-habit]").forEach(b=>b.onclick=()=>{markHabit(b.dataset.hday,b.dataset.habit);render()});
 afterRender(root,c);
}
function renderWeek(){const root=$("diary"),todayKey=dateKey(new Date()),v=PlannerCore.view(db,todayKey,days),c=PlannerCore.counts(v);
const mark={open:'',done:'✓',overdue:'',missed:'✕'};
root.className="diary";root.innerHTML=v.map(d=>{const live=d.items.filter(i=>i.state!=='missed'),dn=live.filter(i=>i.state==='done').length;const past=d.date<todayKey;
 return '<section class="day'+(d.isToday?' today':'')+(past?' past':'')+'" data-date="'+d.date+'"><div class="day-head"><span class="dname">'+d.label+'</span><span class="dnum">'+d.num+'</span>'+(live.length?'<span class="dcount">'+dn+'/'+live.length+'</span>':'')+'</div>'+
 (d.items.length?'<div class="lines">'+d.items.map(i=>'<div class="line '+i.state+(i.tappable?'':' frozen')+'" data-day="'+i.day+'" data-id="'+esc(i.id)+'"><span class="dot">'+mark[i.state]+'</span><span class="txt">'+(i.time?'<span class="tm">'+esc(i.time)+'</span>':'')+(i.state==='overdue'?'<span class="late">!</span>':'')+esc(i.title)+(i.note?'<span class="note"> '+esc(i.note)+'</span>':'')+'</span></div>').join('')+'</div>':'')+
 (past?(d.items.length?'':'<div class="empty-past">—</div>'):(d.items.length?'<button class="add-mini" data-add="'+d.date+'" aria-label="Добавить дело">+</button>':'<button class="add-empty" data-add="'+d.date+'" aria-label="Добавить дело">+</button>'))+'</section>'}).join('');
afterRender(root,c)}
function afterRender(root,c){$("wk-title").textContent=weekTitle();
$("mode-toggle").textContent=mode==="day"?"▦ Вся неделя":"▤ Один день";
$("hcount").textContent=c.done+"/"+c.total;
root.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>openDialog(b.dataset.add));
root.querySelectorAll(".line").forEach(row=>{let timer=null,held=false;
 const start=()=>{held=false;timer=setTimeout(()=>{held=true;reloadDb();const t=PlannerCore.find(db,row.dataset.day,row.dataset.id);if(t&&confirm("Удалить «"+t.title+"»?")){if(String(t.id).startsWith("siri:")){const g=siriDeleted();g.push(String(t.id));try{localStorage.setItem(DELKEY,JSON.stringify(g))}catch(x){}}db[row.dataset.day]=(db[row.dataset.day]||[]).filter(x=>String(x.id)!==row.dataset.id);persist();render()}},550)};
 const stop=()=>{clearTimeout(timer)};
 row.addEventListener("touchstart",start,{passive:true});row.addEventListener("touchend",stop);row.addEventListener("touchmove",stop,{passive:true});
 row.addEventListener("mousedown",start);row.addEventListener("mouseup",stop);row.addEventListener("mouseleave",stop);
 row.addEventListener("contextmenu",e=>e.preventDefault());
 row.onclick=()=>{if(held){held=false;return}if(row.classList.contains("frozen"))return;reloadDb();const t=PlannerCore.find(db,row.dataset.day,row.dataset.id);if(!t)return;PlannerCore.setDone(db,row.dataset.day,row.dataset.id,!t.done,dateKey(new Date()));if(String(t.id).startsWith("siri:"))try{window.webkit?.messageHandlers?.reminders?.postMessage({complete:String(t.id).slice(5),done:!!t.done})}catch(e){}persist();render()};
});
}
$("add-today").onclick=()=>{let k=dateKey(new Date());openDialog(mode==="day"&&sel&&sel>=k?sel:(days.find(d=>d.date>=k)||days[0]).date)};
$("wk-prev").onclick=()=>shiftWeek(-1);$("wk-next").onclick=()=>shiftWeek(1);
$("wk-title").onclick=()=>{if(weekOffset){weekOffset=0;days=buildDays();sel=dateKey(new Date());render()}};
$("mode-toggle").onclick=()=>{mode=mode==="day"?"week":"day";try{localStorage.setItem("alina-tasks-mode",mode)}catch(e){}render()};
function openDialog(date){selected=date;let d=days.find(x=>x.date===date),goalData={goals:[],projects:[]};try{goalData=JSON.parse(localStorage.getItem("alina-goals-projects-v1")||"{}")}catch(e){}let opts=[...((goalData.projects||[]).map(x=>({id:"project:"+x.id,label:"📁 "+x.name}))),...((goalData.goals||[]).map(x=>({id:"goal:"+x.id,label:"🎯 "+x.name})))];$("dialog-root").innerHTML='<div class="dialog-shade"><form class="dialog" id="task-dialog"><h2>Новое дело · '+d.name+', '+d.num+'</h2><input id="new-title" maxlength="160" placeholder="Что нужно сделать?" required autofocus><div class="tlabel">Время, если нужно</div><input id="new-time" type="time" aria-label="Время, если нужно"><select id="new-link"><option value="">Без проекта и цели</option>'+opts.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.label)+'</option>').join("")+'</select><div class="actions"><button type="button" class="cancel" id="close-dialog">Отмена</button><button type="submit">Добавить</button></div></form></div>';$("close-dialog").onclick=()=>{$("dialog-root").innerHTML="";selected=null;render()};$("task-dialog").onsubmit=e=>{e.preventDefault();let title=$("new-title").value.trim(),link=$("new-link").value,time=/^\d{2}:\d{2}$/.test($("new-time").value)?$("new-time").value:"";if(!title)return;reloadDb();db[date]=db[date]||[];db[date].push(Object.assign({id:String(Date.now())+Math.random().toString(36).slice(2),title,done:false,link},time?{time}:{}));persist();$("dialog-root").innerHTML="";selected=null;render()};setTimeout(()=>$("new-title")?.focus(),50)}
document.getElementById("siri-import").onclick=()=>{try{window.webkit.messageHandlers.reminders.postMessage({})}catch(e){alert("Синхронизация Siri доступна в установленном приложении для iPhone после обновления.")}};
// Напоминания подтягиваются сами при открытии и возвращении в приложение; кнопка делает то же с сообщением.
const DELKEY="alina-siri-deleted-v1";let quietImport=false,lastAuto=0;
const siriDeleted=()=>readJson(DELKEY,[]);
function askReminders(quiet){quietImport=quiet;try{window.webkit.messageHandlers.reminders.postMessage(quiet?{silent:true}:{})}catch(e){if(!quiet)alert("Синхронизация Siri доступна в установленном приложении для iPhone после обновления.")}}
function autoReminders(){const n=Date.now();if(n-lastAuto<20000)return;lastAuto=n;askReminders(true)}
document.getElementById("siri-import").onclick=()=>askReminders(false);
window.addEventListener("message",e=>{if(e.data?.type!=="apple-reminders"||!Array.isArray(e.data.items))return;const quiet=quietImport;quietImport=false;reloadDb();let count=0,changed=false;const gone=siriDeleted();
 for(let t of e.data.items){const id="siri:"+t.id;if(gone.includes(id)||!/^\d{4}-\d{2}-\d{2}$/.test(t.date||""))continue;
  let time=/^\d{2}:\d{2}$/.test(t.time||"")?t.time:"",old=null,oldDay=null;
  for(const d of Object.keys(db)){const f=(db[d]||[]).find(x=>x&&x.id===id);if(f){old=f;oldDay=d;break}}
  if(old){if(oldDay!==t.date){db[oldDay]=db[oldDay].filter(x=>x!==old);(db[t.date]=db[t.date]||[]).push(old);changed=true}
   if(old.title!==t.title||old.time!==time){old.title=t.title;old.time=time;changed=true}
   if(t.done&&!old.done){old.done=true;old.doneDate=dateKey(new Date())>t.date?dateKey(new Date()):t.date;changed=true}}
  else{(db[t.date]=db[t.date]||[]).push({id,title:t.title,done:!!t.done,time,source:"reminders"});count++;changed=true}}
 if(changed){persist();render()}
 if(!quiet)alert(count?"Добавлено дел из Напоминаний: "+count:"Новых дел из Напоминаний нет. У напоминания должна быть указана дата.")});
const deepDay=new URLSearchParams(location.search).get("day");if(deepDay&&days.some(d=>d.date===deepDay)){setTimeout(()=>openDialog(deepDay),120)}
render();sync();const refresh=()=>{reloadDb();if(PlannerCore.migrate(db))localStorage.setItem(KEY,JSON.stringify(db));render();sync()};window.addEventListener("focus",()=>{refresh();autoReminders()});document.addEventListener("visibilitychange",()=>{if(!document.hidden){refresh();autoReminders()}});setTimeout(autoReminders,600);setInterval(()=>{if(!document.hidden)autoReminders()},120000);window.addEventListener("storage",e=>{if(e.key===KEY){reloadDb();render()}});
