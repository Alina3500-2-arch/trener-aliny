<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbf7f7"><title>Мои дела</title><style>
:root{color-scheme:light;--bg:#fbf7f7;--card:#fff;--ink:#342c33;--muted:#857782;--rose:#b97790;--line:#efdee5}*{box-sizing:border-box}body{margin:0;padding:calc(env(safe-area-inset-top) + 15px) 15px 105px;background:var(--bg);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,sans-serif}h1{font-size:27px;margin:6px 0}h2{font-size:17px;margin:0 0 10px}.muted{color:var(--muted);font-size:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:21px;padding:16px;margin-top:14px}.days{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin-top:15px}.day{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 2px;text-align:center;color:var(--muted);font-size:11px}.day strong{display:block;color:var(--ink);font-size:16px;margin-top:3px}.day.active{background:#f3e2e9;border-color:var(--rose);color:#96576e}input{width:100%;background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px;color:var(--ink);font:inherit}button{background:var(--rose);color:white;border:0;border-radius:12px;padding:12px 14px;font:inherit;font-weight:650}.row{display:flex;gap:8px}.row input{flex:1;min-width:0}.item{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.item .check{width:25px;height:25px;border:2px solid #c6a2b0;border-radius:8px;background:white;flex:0 0 25px;padding:0}.item.done .check{background:var(--rose);border-color:var(--rose)}.item.done .check:after{content:'✓';color:white}.item.done .name{text-decoration:line-through;color:var(--muted)}.item .name{flex:1;min-width:0;overflow-wrap:anywhere}.item .del{background:transparent;color:#aa8e99;padding:7px}.empty{text-align:center;padding:25px 8px;color:var(--muted)}.progress{height:7px;background:#f4e9ed;border-radius:9px;overflow:hidden;margin-top:12px}.progress>div{height:100%;background:var(--rose)}</style></head><body>
<div class="muted">🌸 ПЛАНИРОВЩИК</div><h1>Мои дела на день</h1><div class="muted">План на понедельник — субботу. Воскресенье — для себя.</div>
<div class="days" id="days"></div>
<div class="card"><h2 id="heading">Задачи</h2><div class="row"><input id="task" placeholder="Что нужно сделать?" maxlength="160"><button id="add">+</button></div><div class="progress"><div id="progress"></div></div><div class="muted" id="count" style="margin-top:8px"></div><div id="list"></div></div>
<div class="card"><h2>Неделя в одном месте</h2><div class="muted">Добавляй задачи на каждый день, отмечай выполненное. На виджете iPhone будут видны ближайшие 6 дней и прогресс.</div></div>
<script>
"use strict";const KEY="alina-daily-tasks-v1";const $=id=>document.getElementById(id);const dateKey=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-");const monday=()=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d};const days=Array.from({length:6},(_,i)=>{const d=monday();d.setDate(d.getDate()+i);return {date:dateKey(d),num:d.getDate(),name:["Пн","Вт","Ср","Чт","Пт","Сб"][i]}});let db={};try{db=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){};let selected=days.some(x=>x.date===dateKey(new Date()))?dateKey(new Date()):days[0].date;function persist(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert("Не удалось сохранить задачи")};sync()}function sync(){const payload={days:days.map(d=>({date:d.date,label:d.name,tasks:(db[d.date]||[]).map(t=>({id:t.id,title:t.title,done:!!t.done}))}))};try{window.webkit?.messageHandlers?.tasks?.postMessage(payload)}catch(e){}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function render(){const selectedDay=days.find(d=>d.date===selected);$("days").innerHTML=days.map(d=>'<button class="day '+(d.date===selected?"active":"")+'" data-date="'+d.date+'">'+d.name+'<strong>'+d.num+'</strong></button>').join("");$("days").querySelectorAll("button").forEach(b=>b.onclick=()=>{selected=b.dataset.date;render()});$("heading").textContent="Дела на "+selectedDay.name.toLowerCase()+", "+selectedDay.num;const tasks=db[selected]||[];const done=tasks.filter(t=>t.done).length;$("count").textContent=done+" из "+tasks.length+" выполнено";$("progress").style.width=(tasks.length?done/tasks.length*100:0)+"%";$("list").innerHTML=tasks.length?tasks.map(t=>'<div class="item '+(t.done?"done":"")+'"><button class="check" data-toggle="'+esc(t.id)+'" aria-label="Отметить"></button><span class="name">'+esc(t.title)+'</span><button class="del" data-del="'+esc(t.id)+'" aria-label="Удалить">×</button></div>').join(""):'<div class="empty">Пока задач нет. Добавь первую 🌸</div>';$("list").querySelectorAll("[data-toggle]").forEach(b=>b.onclick=()=>{const t=(db[selected]||[]).find(x=>x.id===b.dataset.toggle);if(t){t.done=!t.done;persist();render()}});$("list").querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{db[selected]=(db[selected]||[]).filter(x=>x.id!==b.dataset.del);persist();render()})}function add(){const value=$("task").value.trim();if(!value)return;db[selected]=db[selected]||[];db[selected].push({id:String(Date.now())+Math.random().toString(36).slice(2,6),title:value,done:false});$("task").value="";persist();render()}$("add").onclick=add;$("task").onkeydown=e=>{if(e.key==="Enter")add()};window.addEventListener("focus",sync);render();sync();
</script></body></html>
