<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbf7f7"><title>Мои дела</title><style>
:root{color-scheme:light;--bg:#fbf7f8;--ink:#44343e;--muted:#9b8290;--rose:#b97790;--line:#efdae3}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--ink);padding:calc(env(safe-area-inset-top) + 65px) 13px 8px;display:flex;flex-direction:column}
header{flex:none;padding:0 2px 9px}h1{font:700 25px Georgia,serif;margin:0 0 3px}.sub{font-size:12px;color:var(--muted)}
.diary{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:9px}
.diary-day{min-height:0;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:18px;padding:11px;display:flex;flex-direction:column}
.diary-day.selected{border:2px solid var(--rose);background:#fff9fb;padding:10px}
.diary-title{display:flex;align-items:center;gap:4px;font-size:15px;font-weight:800;color:#9d5c76;padding-bottom:7px;border-bottom:1px solid var(--line);flex:none}.diary-title b{margin-left:auto;font-size:12px;color:var(--muted)}
.diary-lines{min-height:0;overflow:auto;flex:1;font-size:12px}.diary-line{display:flex;gap:5px;align-items:flex-start;padding:5px 0;border-bottom:1px solid #f5edf0;overflow-wrap:anywhere}
.diary-line button{border:0;background:transparent;color:var(--rose);padding:0 2px;font-size:14px;flex:none}.diary-line.done span{text-decoration:line-through;opacity:.55}
.add-line{display:flex;gap:3px;align-items:center;margin-top:6px;flex:none}.add-line input{width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px 5px;font-size:12px;color:var(--ink)}.add-line button{border:0;border-radius:8px;background:var(--rose);color:white;padding:7px 9px;font-size:16px}.hint{font-size:12px;color:var(--muted);margin-top:9px}
</style></head><body><header><h1>Мои дела 🌸</h1><div class="sub">Понедельник — суббота · нажми на день, чтобы добавить дело</div></header><div class="diary" id="diary"></div><script>
"use strict";
const KEY="alina-daily-tasks-v1", $=id=>document.getElementById(id),dateKey=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-");
let db={};try{db=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){}
let today=new Date(),monday=new Date(today);monday.setDate(today.getDate()-((today.getDay()+6)%7));
const names=["Пн","Вт","Ср","Чт","Пт","Сб"],days=names.map((name,i)=>{let d=new Date(monday);d.setDate(monday.getDate()+i);return {name,num:d.getDate(),date:dateKey(d)}});
let selected=days.some(d=>d.date===dateKey(today))?dateKey(today):days[0].date;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function sync(){let payload={days:days.map(d=>({date:d.date,label:d.name,tasks:(db[d.date]||[]).map(t=>({id:t.id,title:t.title,done:!!t.done}))}))};try{window.webkit?.messageHandlers?.tasks?.postMessage(payload)}catch(e){}try{window.parent.postMessage({type:"dailyTasks",payload},"*")}catch(e){}}
function persist(){localStorage.setItem(KEY,JSON.stringify(db));sync()}
function render(){const root=$("diary");root.innerHTML=days.map(d=>{let arr=db[d.date]||[],done=arr.filter(t=>t.done).length;return '<section class="diary-day '+(selected===d.date?'selected':'')+'" data-date="'+d.date+'"><div class="diary-title">'+d.name+' '+d.num+'<b>'+done+'/'+arr.length+'</b></div><div class="diary-lines">'+(arr.length?arr.map(t=>'<div class="diary-line '+(t.done?'done':'')+'"><button data-toggle="'+esc(t.id)+'">'+(t.done?'☑':'□')+'</button><span>'+esc(t.title)+'</span><button data-del="'+esc(t.id)+'" aria-label="Удалить">×</button></div>').join(""):'<div class="hint">+ Запланировать</div>')+'</div>'+(selected===d.date?'<form class="add-line" data-add="'+d.date+'"><input aria-label="Новое дело" placeholder="Новое дело..." maxlength="160"><button type="submit">+</button></form>':'')+'</section>'}).join("");
root.querySelectorAll(".diary-day").forEach(card=>{card.addEventListener("click",e=>{if(e.target.closest("button,input,form"))return;if(selected!==card.dataset.date){selected=card.dataset.date;render()}})});
root.querySelectorAll("[data-add]").forEach(f=>f.onsubmit=e=>{e.preventDefault();let v=f.querySelector("input").value.trim();if(!v)return;db[selected]=db[selected]||[];db[selected].push({id:String(Date.now())+Math.random().toString(36).slice(2),title:v,done:false});persist();render();});
root.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=()=>{let t=(db[selected]||[]).find(t=>t.id===b.dataset.toggle);if(t){t.done=!t.done;persist();render()}});
root.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{db[selected]=(db[selected]||[]).filter(t=>t.id!==b.dataset.del);persist();render()});
}
render();sync();window.addEventListener("focus",sync);
</script></body></html>
