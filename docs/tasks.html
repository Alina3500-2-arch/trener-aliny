<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbf7f7"><title>Мои дела</title><style>
:root{color-scheme:light;--bg:#fbf7f8;--ink:#44343e;--muted:#9b8290;--rose:#b97790;--line:#efdae3}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--ink);padding:calc(env(safe-area-inset-top) + 65px) 13px 8px;display:flex;flex-direction:column}
header{flex:none;padding:0 2px 9px}h1{font:700 25px Georgia,serif;margin:0 0 3px}.sub{font-size:12px;color:var(--muted)}
.diary{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:9px}
.diary-day{min-height:0;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:18px;padding:11px;display:flex;flex-direction:column}
.diary-day.selected{border:2px solid var(--rose);background:#fff9fb;padding:10px}
.diary-title{display:flex;align-items:center;gap:4px;font-size:15px;font-weight:800;color:#9d5c76;padding-bottom:7px;border-bottom:1px solid var(--line);flex:none}.diary-title b{margin-left:auto;font-size:12px;color:var(--muted)}
.diary-lines{min-height:0;overflow:auto;flex:1;font-size:12px}.diary-line{display:flex;gap:5px;align-items:flex-start;padding:5px 0;border-bottom:1px solid #f5edf0;overflow-wrap:anywhere}
.diary-line button{border:0;background:transparent;color:var(--rose);padding:0 2px;font-size:14px;flex:none}.diary-line.done span{text-decoration:line-through;opacity:.55}.diary-line.overdue{background:#fff0f1;border-left:3px solid #ee4766;border-radius:6px;padding-left:5px}.diary-line.overdue span{color:#c43150;font-weight:700}
.add-line{display:flex;gap:3px;align-items:center;margin-top:6px;flex:none}.add-line input{width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px 5px;font-size:12px;color:var(--ink)}.add-line button{border:0;border-radius:8px;background:var(--rose);color:white;padding:7px 9px;font-size:16px}.hint{font-size:12px;color:var(--muted);margin-top:9px}.dialog-shade{position:fixed;inset:0;background:#36202a66;z-index:30;display:flex;align-items:center;justify-content:center;padding:20px}.dialog{background:#fff;border-radius:22px;padding:20px;width:100%;max-width:390px;box-shadow:0 12px 45px #38202a30}.dialog h2{font-size:20px;margin:0 0 12px}.dialog input,.dialog select{display:block;width:100%;border:1px solid var(--line);border-radius:12px;padding:13px;margin:10px 0;color:var(--ink);background:#fff;font-size:16px}.dialog button{background:var(--rose);color:white;border:0;border-radius:12px;padding:12px 18px;font-weight:700}.dialog .cancel{background:#f4e8ed;color:#80526b;margin-left:8px}.diary-day{cursor:pointer}.diary-line .tm{font-weight:600;color:var(--rose);font-variant-numeric:tabular-nums;margin-right:2px}
</style></head><body><header><h1>Планировщик 🌸</h1><div class="sub">Понедельник — суббота · нажми на день, чтобы добавить дело</div><button id="siri-import" style="border:0;background:transparent;color:#b97790;font-size:12px;padding:7px 0 0;font-weight:700">↻ Загрузить дела из Siri / Напоминаний</button></header><div class="diary" id="diary"></div><div id="dialog-root"></div><script>
"use strict";
const KEY="alina-daily-tasks-v1", $=id=>document.getElementById(id),dateKey=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-");
let db={};try{db=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){}
let today=new Date(),monday=new Date(today);monday.setDate(today.getDate()-((today.getDay()+6)%7));
const names=["Пн","Вт","Ср","Чт","Пт","Сб"],days=names.map((name,i)=>{let d=new Date(monday);d.setDate(monday.getDate()+i);return {name,num:d.getDate(),date:dateKey(d)}});
let selected=null;
const byTime=arr=>arr.map((t,n)=>({t,n})).sort((a,b)=>((a.t.time?0:1)-(b.t.time?0:1))||String(a.t.time||"").localeCompare(String(b.t.time||""))||a.n-b.n).map(x=>x.t);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function carryOver(){let changed=false;for(let i=0;i<days.length;i++){const d=days[i];if(d.date>=dateKey(new Date()))break;const next=days[i+1];if(!next)break;for(const t of db[d.date]||[]){if(t.done||t.carriedTo===next.date)continue;db[next.date]=db[next.date]||[];if(!db[next.date].some(x=>x.origin=== (t.origin||t.id))){db[next.date].push({...t,id:"carry-"+t.id+"-"+next.date,origin:t.origin||t.id,done:false,overdue:true})}t.carriedTo=next.date;changed=true}}if(changed)localStorage.setItem(KEY,JSON.stringify(db))}
carryOver();
function sync(){let payload={days:days.map(d=>({date:d.date,label:d.name,tasks:byTime(db[d.date]||[]).map(t=>Object.assign({id:t.id,title:t.title,done:!!t.done,overdue:!!t.overdue},t.time?{time:t.time}:{}))}))};try{window.webkit?.messageHandlers?.tasks?.postMessage(payload)}catch(e){}try{window.parent.postMessage({type:"dailyTasks",payload},"*")}catch(e){}}
function persist(){localStorage.setItem(KEY,JSON.stringify(db));sync()}
function render(){const root=$("diary");root.innerHTML=days.map(d=>{let arr=db[d.date]||[],done=arr.filter(t=>t.done).length;return '<section class="diary-day '+(selected===d.date?'selected':'')+'" data-date="'+d.date+'"><div class="diary-title">'+d.name+' '+d.num+'<b>'+done+'/'+arr.length+'</b></div><div class="diary-lines">'+(arr.length?byTime(arr).map(t=>'<div class="diary-line '+(t.done?'done':'')+'"><button data-toggle="'+esc(t.id)+'">'+(t.done?'☑':'□')+'</button><span>'+(t.time?'<b class="tm">'+esc(t.time)+'</b> ':'')+esc(t.title)+'</span><button data-del="'+esc(t.id)+'" aria-label="Удалить">×</button></div>').join(""):'<div class="hint">+ Запланировать</div>')+'</div>' +''+'</section>'}).join("");
root.querySelectorAll(".diary-day").forEach(card=>{card.addEventListener("click",e=>{if(e.target.closest("button,input,form"))return;openDialog(card.dataset.date)})});
root.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=()=>{let day=b.closest(".diary-day").dataset.date;let t=(db[day]||[]).find(t=>t.id===b.dataset.toggle);if(t){t.done=!t.done;persist();render()}});
root.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{let day=b.closest(".diary-day").dataset.date;db[day]=(db[day]||[]).filter(t=>t.id!==b.dataset.del);persist();render()});
}
function openDialog(date){selected=date;let d=days.find(x=>x.date===date),goalData={goals:[],projects:[]};try{goalData=JSON.parse(localStorage.getItem("alina-goals-projects-v1")||"{}")}catch(e){}let opts=[...((goalData.projects||[]).map(x=>({id:"project:"+x.id,label:"📁 "+x.name}))),...((goalData.goals||[]).map(x=>({id:"goal:"+x.id,label:"🎯 "+x.name})))];$("dialog-root").innerHTML='<div class="dialog-shade"><form class="dialog" id="task-dialog"><h2>Дела на '+d.name+', '+d.num+'</h2><input id="new-title" maxlength="160" placeholder="Что нужно сделать?" required autofocus><input id="new-time" type="time" aria-label="Время, если нужно"><select id="new-link"><option value="">Без проекта и цели</option>'+opts.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.label)+'</option>').join("")+'</select><button type="submit">Добавить дело</button><button type="button" class="cancel" id="close-dialog">Отмена</button></form></div>';$("close-dialog").onclick=()=>{$("dialog-root").innerHTML="";selected=null;render()};$("task-dialog").onsubmit=e=>{e.preventDefault();let title=$("new-title").value.trim(),link=$("new-link").value,time=/^\d{2}:\d{2}$/.test($("new-time").value)?$("new-time").value:"";if(!title)return;db[date]=db[date]||[];db[date].push(Object.assign({id:String(Date.now())+Math.random().toString(36).slice(2),title,done:false,link},time?{time}:{}));persist();$("dialog-root").innerHTML="";selected=null;render()};setTimeout(()=>$("new-title")?.focus(),50)}
document.getElementById("siri-import").onclick=()=>{try{window.webkit.messageHandlers.reminders.postMessage({})}catch(e){alert("Синхронизация Siri доступна в установленном приложении для iPhone после обновления.")}};
window.addEventListener("message",e=>{if(e.data?.type!=="apple-reminders"||!Array.isArray(e.data.items))return;let count=0;for(let t of e.data.items){if(!days.some(d=>d.date===t.date))continue;db[t.date]=db[t.date]||[];let id="siri:"+t.id;let old=db[t.date].find(x=>x.id===id);let time=/^\d{2}:\d{2}$/.test(t.time||"")?t.time:"";if(old){old.title=t.title;old.done=!!t.done;old.time=time}else{db[t.date].push({id,title:t.title,done:!!t.done,time,source:"reminders"});count++}}persist();render();alert(count?"Добавлено дел из Напоминаний: "+count:"Новых дел на эту неделю нет. У напоминаний должна быть указана дата.")});
const deepDay=new URLSearchParams(location.search).get("day");if(deepDay&&days.some(d=>d.date===deepDay)){setTimeout(()=>openDialog(deepDay),120)}
render();sync();window.addEventListener("focus",()=>{carryOver();render();sync()});
</script></body></html>
