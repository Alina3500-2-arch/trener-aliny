<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbf7f7"><title>Режим результата</title><style>
:root{color-scheme:light;--bg:#fbf7f7;--card:#fff;--ink:#322c32;--muted:#827780;--accent:#ba778e;--line:#f0e2e7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:calc(env(safe-area-inset-top) + 18px) 16px 110px}h1{font-size:27px;letter-spacing:-.8px;margin:8px 0 5px}h2{font-size:17px;margin:0 0 12px}.muted{color:var(--muted);font-size:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:17px;margin-top:14px;box-shadow:0 6px 20px #6b3a4810}label{display:block;font-size:12px;font-weight:650;color:var(--muted);margin:12px 0 5px}input,textarea{display:block;width:100%;font:inherit;border:1px solid var(--line);border-radius:12px;background:#fdf9fa;color:var(--ink);padding:12px;outline:none}textarea{min-height:65px;resize:vertical}button{font:inherit;background:var(--accent);color:white;border:0;border-radius:13px;padding:12px 16px;font-weight:650}button.secondary{background:#f5e9ed;color:#895468}button:disabled{opacity:.5}.row{display:flex;gap:9px}.row>*{flex:1;min-width:0}.meter{height:11px;border-radius:20px;background:#f3e8eb;overflow:hidden;margin-top:12px}.meter>div{height:100%;background:#c7869b;width:0;transition:width .2s}.task{padding:13px 0;border-top:1px solid var(--line)}.task:first-child{border:0}.task.done{opacity:.55}.task strong{font-size:15px}.task p{margin:6px 0;color:var(--muted);font-size:13px}.timer{font-variant-numeric:tabular-nums;font-size:22px;font-weight:750}.pill{display:inline-block;background:#f6e7ed;border-radius:20px;padding:5px 9px;font-size:12px;color:#895468}.top{display:flex;align-items:center;justify-content:space-between}
</style></head><body><div class="top"><div><div class="muted">ПЛАНИРОВЩИК</div><h1>Режим результата</h1><div class="muted">Меньше доработок — больше результата</div></div><span style="font-size:35px">🌸</span></div>
<section class="card"><h2>Финансовая цель месяца</h2><div class="row"><div><label>Цель, ₽</label><input id="goal" type="number" min="0" inputmode="numeric"></div><div><label>Получено, ₽</label><input id="earned" type="number" min="0" inputmode="numeric"></div></div><div class="meter"><div id="bar"></div></div><p id="percent" class="muted"></p><label>Главное действие, которое принесёт деньги</label><textarea id="main" placeholder="Например: отправить 5 предложений клиентам"></textarea></section>
<section class="card"><h2>Задача с конкретным результатом</h2><label>Что сделать?</label><input id="taskTitle" placeholder="Например: отправить КП"><label>Как это связано с заработком?</label><input id="purpose" placeholder="Получить ответ от потенциального клиента"><label>Самый короткий тест</label><input id="test" placeholder="Одна версия, без идеальной упаковки"><div class="row"><div><label>Лимит, минут</label><input id="limit" type="number" min="5" value="30"></div><div><label>Критерий готовности</label><input id="criterion" placeholder="КП отправлено"></div></div><button style="width:100%;margin-top:13px" onclick="addTask()">Добавить задачу</button></section>
<section class="card"><h2>Задачи и таймер</h2><div id="tasks" class="muted">Задач пока нет</div></section>
<section class="card"><h2>Вечерний разбор</h2><div class="muted" id="reviewDate"></div><label>Что сегодня принесло результат?</label><textarea id="q1"></textarea><label>Где ушла в перфекционизм?</label><textarea id="q2"></textarea><label>Что сделаю завтра для денег?</label><textarea id="q3"></textarea><label>Что сегодня было хорошо?</label><textarea id="q4"></textarea><button style="width:100%;margin-top:13px" onclick="saveReview()">Сохранить итоги</button></section>
<script>
"use strict";const KEY="alina-result-mode-v1";const today=()=>{let d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};const month=()=>today().slice(0,7);let db;try{db=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){db={}};db.months=db.months||{};db.tasks=db.tasks||[];db.reviews=db.reviews||{};db.months[month()]=db.months[month()]||{goal:0,earned:0,main:""};const current=db.months[month()];const $=id=>document.getElementById(id);function persist(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert("Не удалось сохранить данные. Проверь свободное место.")}}function escapeHtml(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
["goal","earned","main"].forEach(id=>{$(id).value=current[id]||"";$(id).addEventListener("input",()=>{current[id]=id==="main"?$(id).value:Number($(id).value)||0;persist();updateProgress()})});function updateProgress(){let pct=current.goal?Math.round(current.earned/current.goal*100):0;$("bar").style.width=Math.min(100,pct)+"%";$("percent").textContent=pct+"% цели • "+Number(current.earned||0).toLocaleString("ru-RU")+" ₽ из "+Number(current.goal||0).toLocaleString("ru-RU")+" ₽"}updateProgress();
function addTask(){let title=$("taskTitle").value.trim();if(!title){alert("Напиши задачу");return}db.tasks.unshift({id:Date.now()+Math.random(),title,purpose:$("purpose").value,test:$("test").value,limit:Math.max(5,Number($("limit").value)||30),criterion:$("criterion").value,done:false,spent:0,started:null,extra:0,reason:""});["taskTitle","purpose","test","criterion"].forEach(id=>$(id).value="");persist();renderTasks()}
function elapsed(t){return t.spent+(t.started?Math.max(0,Math.floor((Date.now()-t.started)/1000)):0)}function toggleTimer(id){let t=db.tasks.find(x=>x.id===id);if(!t)return;if(t.started){t.spent=elapsed(t);t.started=null}else{if(elapsed(t)>= (t.limit+t.extra)*60){let reason=prompt("Лимит исчерпан. Зачем нужны ещё 15 минут?");if(!reason||!reason.trim())return;t.extra+=15;t.reason=reason.trim()}t.started=Date.now()}persist();renderTasks()}function complete(id){let t=db.tasks.find(x=>x.id===id);if(!t)return;t.spent=elapsed(t);t.started=null;t.done=!t.done;persist();renderTasks()}function renderTasks(){let el=$("tasks");if(!db.tasks.length){el.textContent="Задач пока нет";return}el.innerHTML=db.tasks.map(t=>{let secs=elapsed(t),limit=(t.limit+t.extra)*60,over=secs>=limit&&!t.done;return '<div class="task '+(t.done?'done':'')+'"><div class="top"><strong>'+escapeHtml(t.title)+'</strong><span class="pill">'+(t.done?'Готово':over?'Лимит':'В работе')+'</span></div>'+(t.purpose?'<p>💰 '+escapeHtml(t.purpose)+'</p>':'')+(t.test?'<p>Тест: '+escapeHtml(t.test)+'</p>':'')+(t.criterion?'<p>Готово, когда: '+escapeHtml(t.criterion)+'</p>':'')+'<div class="top" style="margin:10px 0"><span class="timer">'+Math.floor(secs/60)+':'+String(secs%60).padStart(2,"0")+'</span><span class="muted">Лимит '+(t.limit+t.extra)+' мин</span></div><div class="row"><button class="secondary" onclick="toggleTimer('+t.id+')">'+(t.started?'Пауза':over?'Продлить +15 мин':'Старт')+'</button><button onclick="complete('+t.id+')">'+(t.done?'Вернуть':'Готово ✓')+'</button></div></div>'}).join("")}renderTasks();setInterval(()=>{if(db.tasks.some(t=>t.started))renderTasks()},1000);
$("reviewDate").textContent=new Date().toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"});const review=db.reviews[today()]||{};["q1","q2","q3","q4"].forEach(id=>$(id).value=review[id]||"");function saveReview(){db.reviews[today()]={};["q1","q2","q3","q4"].forEach(id=>db.reviews[today()][id]=$(id).value);persist();alert("Итоги сохранены")}
</script></body></html>
