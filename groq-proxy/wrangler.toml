name = "groq-proxy"
main = "src/index.js"
compatibility_date = "2026-08-05"
compatibility_flags = ["nodejs_compat"]

# Groq блокирует часть регионов. Durable Object в US-юрисдикции даёт
# стабильный американский исходящий маршрут для голоса, фото и чата.
[[durable_objects.bindings]]
name = "GROQ_US"
class_name = "GroqUSEgress"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GroqUSEgress"]

# KV для хранения данных виджета тренировок
[[kv_namespaces]]
binding = "WIDGET_KV"

# ID намеренно не указан: современный Wrangler создаст KV автоматически при
# первом deploy и запишет настоящий ID обратно в этот файл.

# Секреты задаются командой (НЕ храним в файле):
#   npx wrangler secret put GROQ_KEY
#   npx wrangler secret put PROXY_TOKEN   (необязательно)
