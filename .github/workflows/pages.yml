name: Deploy GitHub Pages

# Публикует папку docs/ на GitHub Pages автоматически — без единого клика в
# Settings → Pages. Официальный экшен actions/configure-pages сам включает
# Pages для репозитория (source: GitHub Actions) при первом запуске, если
# он ещё не включён. Срабатывает на каждый пуш, меняющий docs/.

on:
  push:
    branches:
      - master
      - claude/fitness-tracker-html-migration-orrpaw
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: docs
      - name: Wait for the Pages artifact to be listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$PAGES_ARTIFACT_NAME" \
              --jq ".artifacts[] | select(.name == \"$PAGES_ARTIFACT_NAME\") | .id") || artifact_id=
            if [[ -n "$artifact_id" ]]; then
              exit 0
            fi
            sleep 3
          done
          echo "::error::Pages artifact did not become available."
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
